<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day 💘</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-200px); opacity: 0; }
        }

        .envelope {
            position: relative;
            width: 250px;
            height: 180px;
            background: #fdf5e6;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.5s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100px;
            background: #ff8fa3;
            clip-path: polygon(0 0, 50% 60%, 100% 0);
            transition: transform 0.5s ease;
        }

        .letter {
            position: absolute;
            width: 220px;
            height: 150px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: red;
            font-weight: bold;
            transform: translateY(100%);
            transition: transform 0.5s ease;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 20px;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #ff4d6d, #ff6b81);
            transform: scale(1.1);
        }

        /* Open animation */
        .open .flap {
            transform: rotateX(180deg);
        }

        .open .letter {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Floating Hearts -->
        <div class="heart" style="left: 20%; animation-delay: 0s;">❤️</div>
        <div class="heart" style="left: 50%; animation-delay: 1s;">💖</div>
        <div class="heart" style="left: 80%; animation-delay: 2s;">💘</div>

        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="letter">💌 Happy Valentine's Day ❤️</div>
        </div>
        <button onclick="openEnvelope()">Click to Open</button>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById("envelope").classList.add("open");
        }

        // Floating hearts animation
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "%";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createHeart, 1000);
    </script>

</body>
</html>
